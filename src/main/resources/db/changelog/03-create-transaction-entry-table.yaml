databaseChangeLog:
  - changeSet:
      id: create-table-transaction-entry
      author: user
      changes:
        - createTable:
            tableName: transaction_entry
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transaction_entry_transaction
                    references: transaction(id)
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transaction_entry_account
                    references: account(id)
              - column:
                  name: entry_type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_transaction_entry_account_id
            tableName: transaction_entry
            columns:
              - column:
                  name: account_id
        - createIndex:
            indexName: idx_transaction_entry_transaction_id
            tableName: transaction_entry
            columns:
              - column:
                  name: transaction_id